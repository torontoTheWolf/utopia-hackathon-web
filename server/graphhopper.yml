# GraphHopper settings for the places API, which starts it with the extract and the graph folder filled in.
# Based on config-example.yml from GraphHopper 11.1: https://github.com/graphhopper/graphhopper
graphhopper:
  profiles:
    - name: car
      # Turn restrictions, and a minute's penalty for U-turns.
      turn_costs:
        vehicle_types: [motorcar, motor_vehicle]
        u_turn_costs: 60
      custom_model_files: [car.json]
    - name: foot
      custom_model_files: [foot.json]

  # Contraction hierarchies: a slow one-off preparation that makes each route take milliseconds.
  profiles_ch:
    - profile: car
    - profile: foot
  profiles_lm: []

  graph.encoded_values: car_access, car_average_speed, road_access, road_class, country, foot_access, foot_average_speed, foot_priority, foot_road_access, hike_rating, mtb_rating
  prepare.min_network_size: 200
  prepare.subnetworks.threads: 2
  prepare.ch.threads: 2
  # Points never snap onto tunnels, bridges or ferries, such as an expressway above the street you're on.
  routing.snap_preventions_default: tunnel, bridge, ferry
  # Footways, paths and steps are needed for walking.
  import.osm.ignored_highways: ""
  graph.dataaccess.default_type: RAM_STORE
  # Street names in directions are in English where the map has them.
  datareader.preferred_language: en

server:
  application_connectors:
    - type: http
      port: 8989
      bind_host: 127.0.0.1
  request_log:
    appenders: []
  admin_connectors:
    - type: http
      port: 8990
      bind_host: 127.0.0.1

logging:
  level: INFO
  appenders:
    - type: file
      current_log_filename: graphhopper.log
      archive: false
